[package]
name = "lazydc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bollard = "0.18"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dialoguer = "0.11"
dirs = "6.0"
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.15"
